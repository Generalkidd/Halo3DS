name: Setup CLI

on:
  push:
    paths: ['port/n3ds/setup/**', 'docs/SETUP-CLI.md', '.github/workflows/setup-cli.yml']
  pull_request:
    paths: ['port/n3ds/setup/**', 'docs/SETUP-CLI.md', '.github/workflows/setup-cli.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test shared converter
        run: dotnet run --project port/n3ds/setup/Tests -c Release
      - name: Test CLI and guided setup
        run: dotnet run --project port/n3ds/setup/Cli.Tests -c Release
      - name: Check repository contents
        run: python tools/check_repository_contents.py --working-tree
      - name: Publish native self-contained package
        run: python port/n3ds/setup/tools/package-cli.py --runtime ${{ matrix.runtime }}
      - name: Test packaged executable
        shell: python
        run: |
          import pathlib, subprocess
          app = pathlib.Path('build/setup-cli/${{ matrix.runtime }}/app')
          executable = app / ('halo3ds-setup.exe' if '${{ matrix.runtime }}'.startswith('win-') else 'halo3ds-setup')
          result = subprocess.run([str(executable.resolve()), '--help'], capture_output=True, text=True, check=True)
          assert 'step-by-step' in result.stdout, result.stdout
          result = subprocess.run([str(executable.resolve()), 'guided'], input='q\n', capture_output=True, text=True)
          assert result.returncode == 130, result.stderr
      - uses: actions/upload-artifact@v4
        with:
          name: halo3ds-setup-${{ matrix.runtime }}
          path: |
            build/setup-cli/${{ matrix.runtime }}/*.tar.gz
            build/setup-cli/${{ matrix.runtime }}/*.zip
          if-no-files-found: error
